name: DR2 Farm Survey Tests
on:
  push:
    branches-ignore:
      - main
      - release-*
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Upgrade pip & Run unittest
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          pip install -r requirements-tif-to-jpg.txt --no-cache-dir
          pip install -r requirements-validation.txt --no-cache-dir
          python -m unittest
